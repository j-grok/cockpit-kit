<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="cockpit:source" content="self">
  <meta name="cockpit:rendered-at" content="2026-07-05T18:00:00Z">
  <title>Search</title>
  <link rel="stylesheet" href="../cockpit.css">
  <script src="../cockpit-theme.js"></script>
</head>
<body>
  <nav aria-label="Primary" class="cockpit-nav">
    <form class="nav-search" action="./" method="get" role="search">
      <label for="nav-search-input">Search Cockpit</label>
      <div class="nav-search-field"><span aria-hidden="true">⌕</span><input id="nav-search-input" name="q" type="search" autocomplete="off" inputmode="search" placeholder="Search cockpit..."></div>
    </form>
    <a class="home" href="../">Cockpit</a>
    <a href="../inbox/">Inbox</a>
    <a href="./" aria-current="page">Search</a>
    <a href="../design-system.html">Design System</a>
    <fieldset class="theme-switch" data-cockpit-theme-switch hidden>
      <legend>Theme</legend>
      <div class="options">
        <label><input type="radio" name="cockpit-theme" value="system" checked><span>System</span></label>
        <label><input type="radio" name="cockpit-theme" value="light"><span>Light</span></label>
        <label><input type="radio" name="cockpit-theme" value="dark"><span>Dark</span></label>
      </div>
      <span class="sr-only" data-cockpit-theme-resolved></span>
    </fieldset>
  </nav>
  <main class="page">
    <div class="breadcrumbs"><a href="../">Cockpit</a><span class="sep">›</span><span class="here">Search</span></div>
    <header class="masthead">
      <h1>Search</h1>
      <p>Static local search over the generated Cockpit index.</p>
    </header>
    <form class="panel" id="search-form" role="search">
      <label for="q" class="meta-sample">Search local pages</label>
      <div class="nav-search-field" style="margin-top: 8px;"><input id="q" name="q" type="search" autocomplete="off" inputmode="search" placeholder="Search local pages" style="width:100%; min-height:40px; background:var(--surface); color:var(--ink); border:1px solid var(--rule-strong); border-radius:var(--radius); padding:8px 10px; font:inherit;"></div>
    </form>
    <section class="source-line" id="status">Loading search index...</section>
    <h2 class="section">Results</h2>
    <section class="grid-list" id="results" aria-live="polite"></section>
  </main>
  <script type="application/json" id="cockpit-data">{"kind":"cockpit-search","schema_version":1,"summary":"Starter browser search page."}</script>
  <script>
    const form = document.querySelector('#search-form');
    const input = document.querySelector('#q');
    const statusBox = document.querySelector('#status');
    const results = document.querySelector('#results');
    const params = new URLSearchParams(location.search);
    let index = null;

    input.value = params.get('q') || '';

    const terms = (value) => value.toLowerCase().split(/\s+/).filter(Boolean);
    const textOf = (page) => [page.title, page.section, page.summary, page.text, ...(page.headings || []).map((heading) => heading.text)].join(' ').toLowerCase();
    const score = (page, queryTerms) => queryTerms.reduce((total, term) => {
      if (page.title.toLowerCase().includes(term)) return total + 10;
      if ((page.headings || []).some((heading) => heading.text.toLowerCase().includes(term))) return total + 6;
      if ((page.section || '').toLowerCase().includes(term)) return total + 4;
      if ((page.text || '').toLowerCase().includes(term)) return total + 1;
      return total;
    }, 0);

    const render = () => {
      const queryTerms = terms(input.value);
      results.replaceChildren();
      if (!index || !Array.isArray(index.pages) || index.pages.length === 0) {
        statusBox.textContent = 'No search index entries yet. Run `node skill/scripts/search-index.mjs` from Cockpit Kit after pages exist.';
        return;
      }
      if (queryTerms.length === 0) {
        statusBox.textContent = `Search ${index.page_count} indexed page(s).`;
        return;
      }
      const matches = index.pages
        .filter((page) => queryTerms.every((term) => textOf(page).includes(term)))
        .map((page) => ({ page, score: score(page, queryTerms) }))
        .sort((a, b) => b.score - a.score || a.page.title.localeCompare(b.page.title))
        .slice(0, 24);
      statusBox.textContent = `${matches.length} result(s) for "${input.value}".`;
      for (const match of matches) {
        const card = document.createElement('article');
        card.className = 'card';
        const title = document.createElement('h2');
        const link = document.createElement('a');
        link.href = match.page.href;
        link.textContent = match.page.title;
        title.append(link);
        const summary = document.createElement('p');
        summary.textContent = match.page.summary || match.page.section || match.page.path;
        card.append(title, summary);
        results.append(card);
      }
    };

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const url = new URL(location.href);
      if (input.value.trim()) url.searchParams.set('q', input.value.trim());
      else url.searchParams.delete('q');
      history.replaceState(null, '', url);
      render();
    });

    fetch('/.cockpit/search-index.json', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((payload) => { index = payload; render(); })
      .catch((error) => { statusBox.textContent = `Search index unavailable: ${error.message}. Run search-index.mjs, then serve this repo over HTTP.`; });
  </script>
</body>
</html>
